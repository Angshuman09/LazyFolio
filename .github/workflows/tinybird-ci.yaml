name: Tinybird CI

on:
  pull_request:
    paths:
      - "service/tinybird.config.*"
      - "service/**/*.ts"
      - ".github/workflows/tinybird-ci.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TINYBIRD_TOKEN: ${{ secrets.TINYBIRD_TOKEN }}

jobs:
  tinybird:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "service"
    steps:
      - name: Verify Tinybird token
        run: |
          if [ -z "$TINYBIRD_TOKEN" ]; then
            echo "::error::TINYBIRD_TOKEN repository secret is not set. Add it at Settings -> Secrets and variables -> Actions (value is in service/.env.local)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: service/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Deploy preview branch
        run: pnpm run tinybird:preview
