services:
  postgres:
    image: postgres:16-alpine
    container_name: lazyfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lazyfolio
    ports:
      - "5432:5432"
    volumes:
      - lazyfolio_pgdata:/var/lib/postgresql/data

volumes:
  lazyfolio_pgdata:
